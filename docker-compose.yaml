services:
  vllm:
    image: itlackey/ipex-arc-fastchat:latest
    build:
      context: .
    container_name: vllm-arc
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-109}"   # run: stat -c '%g' /dev/dri/renderD128
      - "${VIDEO_GID:-44}"     # run: getent group video | cut -d: -f3
    shm_size: "16g"
    ports:
      - "8000:8000"
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
